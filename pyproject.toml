[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "domdose-core"
version = "0.1.0"
description = "Configuration, dataset contracts and rating method for DomDose"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "contract*", "rating*"]

[tool.setuptools.package-data]
contract = ["dataset.schema.json", "py.typed"]
core = ["py.typed"]
rating = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
