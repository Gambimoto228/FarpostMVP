name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  contract:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: (cd backend && uv sync --locked)
      - run: (cd frontend && npm ci)
      - name: Проверить актуальность TS-типов
        run: ./scripts/check_api_types.sh

  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: domdose-ci-${{ github.run_id }}-${{ github.run_attempt }}
      DOMAIN: http://localhost
    steps:
      - uses: actions/checkout@v4
      - name: Собрать и запустить production-стек
        run: docker compose -f docker-compose.prod.yml up -d --build --wait --wait-timeout 120
      - name: Проверить frontend и backend через прокси
        run: |
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://localhost/ -o /tmp/domdose-index.html
          grep -qi '<!doctype html>' /tmp/domdose-index.html
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://localhost/api/health | python3 -c 'import json, sys; assert json.load(sys.stdin) == {"status": "ok"}'
          # /api/health живёт вне префикса и проходит даже при срезанном префиксе.
          # Поэтому отдельно проверяем реальный эндпоинт под /api: 501 значит, что
          # запрос дошёл до роутера, 404 — что nginx сломал путь.
          status=$(curl -s -o /tmp/domdose-houses.json -w '%{http_code}' --retry 10 --retry-connrefused --retry-delay 1 http://localhost/api/houses)
          echo "GET /api/houses -> $status"
          if [ "$status" != "200" ] && [ "$status" != "501" ]; then
            echo "путь /api/* не дошёл до backend (status $status)" >&2
            exit 1
          fi
      - name: Логи при ошибке
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color
      - name: Удалить тестовый стек
        if: always()
        run: docker compose -f docker-compose.prod.yml down --volumes --remove-orphans
