server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API проксируется на backend без переписывания пути:
    # backend сам смонтирован под /api (см. API_PREFIX в app/main.py),
    # поэтому /api/houses -> http://backend:8000/api/houses.
    # Срезать префикс нельзя: тогда /api/houses уходил бы в /houses и давал 404.
    # Резолв через DNS Docker в рантайме: nginx стартует даже если backend ещё не поднялся.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Хэшированные ассеты Vite — кэшируем надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA-роутинг: всё остальное отдаём index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
